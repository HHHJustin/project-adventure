<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>專案冒險（原型）</title>
<style>
@font-face{font-family:"Cubic 11";src:url(assets/Cubic_11.woff2) format("woff2");font-display:swap}
:root{--ink:#131b1b;--muted:#5d6462;--bg:#eef1e6;--card:#fbedea;--line:#d9cfc4;--accent:#f06733;--green:#5f9a3c;--blue:#2f6fd0;--red:#c2413b;--amber:#d98a1f;--soft:#f6e3c6;
  --w:calc(50vw + 520px);--pad:max(16px,calc((100vw - var(--w))/2 + 16px));--px:"Cubic 11",-apple-system,"PingFang TC","Noto Sans TC",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 -apple-system,"PingFang TC","Noto Sans TC",sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;font-family:var(--px);border:2px solid var(--ink);background:#fff;border-radius:6px;padding:3px 12px;box-shadow:0 2px 0 var(--ink)}
button:hover{background:var(--soft)}
button:active{transform:translateY(2px);box-shadow:none}
button.hi{background:var(--accent);color:#fff}
button.hi:hover{background:#d9541f}
button.sm{padding:1px 9px;font-size:.88rem}
.hud{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;background:var(--ink);color:#fbedea;padding:10px var(--pad);font-family:var(--px)}
.hud .title{font-size:1.25rem;letter-spacing:.05em}
.hud .title small{opacity:.6;margin-left:6px;font-size:.8rem}
.hud select{background:#fbedea;color:var(--ink);border-radius:6px;border:0;padding:4px 8px;max-width:260px;font-family:var(--px)}
.hud .lv{display:flex;align-items:center;gap:8px}
.hud .bar{width:120px;height:10px;background:#3a4444;border:2px solid #fbedea;overflow:hidden}
.hud .bar i{display:block;height:100%;width:0;background:#ffad55;transition:width .5s}
.hud .stat b{font-size:1.1rem;margin-left:4px;color:#ffad55}
.hud #store{margin-left:auto;font-size:.85rem;opacity:.85}
.demo{background:var(--soft);color:#8a4b12;padding:6px var(--pad);font-size:.9rem}
.wrap{max-width:var(--w);margin:0 auto}
#chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 6px}
#chips button{white-space:nowrap;font-size:.88rem;text-align:left;padding:4px 12px;line-height:1.4;flex:none}
#chips button small{display:block;color:var(--muted);font-family:-apple-system,"PingFang TC",sans-serif;font-size:.75rem}
#chips button.doing{background:var(--soft)}
#chips button.doing small{color:#a3530f}
#chips button.done{color:var(--muted)}
#chips button.here{background:#ffd9a8}
.world{margin:8px 16px 0;border:3px solid var(--ink);border-radius:8px;overflow:hidden;background:#eef1e6;box-shadow:0 4px 0 var(--ink)}
canvas{display:block;width:100%;height:min(458px,52vh);cursor:pointer;image-rendering:pixelated}
.hint span:last-child{white-space:nowrap}
.hint{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:6px 12px;line-height:1.5;border-top:3px solid var(--ink);background:#fbedea;color:var(--muted);font-size:.85rem}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:22px 16px 60px}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
.panel{border:15px solid transparent;border-image:url(assets/panel.png) 5 fill / 15px / 0 stretch;image-rendering:pixelated;padding:2px 8px 6px;min-height:240px}
.panel>*{image-rendering:auto}
.panel h2{margin:0 0 4px;font:1.25rem/1.4 var(--px)}
.panel h3{margin:14px 0 4px;font:1rem/1.4 var(--px);color:#8a4b12}
.panel a{color:var(--blue);font-weight:600}
.muted{color:var(--muted);font-size:.88rem}
.acts2{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
button.link{border:0;box-shadow:none;background:none;padding:0 4px;font-size:.8rem;color:#8a4b12;text-decoration:underline;font-family:inherit}
button.link:hover{background:none;color:var(--accent)}
.editable{cursor:pointer;border:2px dashed transparent;border-radius:6px;padding:2px 6px;margin-left:-6px}
.editable:hover{border-color:var(--accent);background:#fff}
.editable b{color:var(--accent);font-weight:500}
.chk{width:18px;height:18px;margin:3px 2px 0 0;accent-color:var(--green);cursor:pointer;flex:none}
.evform{display:grid;gap:8px;margin:8px 0 12px}
.evform input{width:100%;border:2px solid var(--ink);border-radius:6px;padding:5px 8px;background:#fff}
.evform .row{display:flex;gap:8px}.evform label{flex:1;font-size:.85rem;color:var(--muted)}
.evform button{justify-self:start}
.panel details summary{cursor:pointer;margin-top:8px}
details.help{background:var(--soft);border:2px solid var(--ink);border-radius:6px;padding:6px 12px;margin-bottom:10px}
details.help summary{cursor:pointer;font-family:var(--px)}
details.help ol{margin:6px 0 2px;padding-left:20px}
.tag{display:inline-block;font:.75rem/1.5 var(--px);border:2px solid var(--ink);border-radius:4px;padding:0 6px;background:#fff;margin-left:6px;vertical-align:middle}
.tag.red{background:#f6b3ad}.tag.amber{background:#ffd9a8}.tag.grey{background:#e4e0da;color:var(--muted)}.tag.green{background:#c9e2a8}
ul.list{list-style:none;margin:6px 0;padding:0}
ul.list li{border-top:2px dotted var(--line);padding:7px 0;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
ul.list li:first-child{border-top:0}
ul.list li .t{flex:1;min-width:0}
ul.list li.due{background:var(--soft);margin:0 -6px;padding:7px 6px;border-radius:6px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button.on{background:var(--ink);color:#fbedea}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.kpi div{background:#fff;border:2px solid var(--ink);border-radius:6px;padding:6px 10px;font-size:.85rem}
.kpi b{display:block;font:1.4rem/1.3 var(--px)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{border-bottom:2px dotted var(--line);padding:5px 4px;text-align:left}
th{color:var(--muted);font-weight:500}
#modal{position:fixed;inset:0;background:rgba(19,27,27,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
#modal[hidden]{display:none}
.card-form{border:18px solid transparent;border-image:url(assets/paper.png) 5 fill / 18px / 0 stretch;image-rendering:pixelated;padding:4px 8px;width:min(540px,100%);max-height:92vh;overflow:auto}
.card-form>*{image-rendering:auto}
.card-form h2{margin:0 0 2px;font:1.3rem/1.4 var(--px)}
.card-form label{display:block;margin-top:10px;font-size:.88rem;color:#5a3a12}
.card-form select,.card-form input[type=text],.card-form input[type=date],.card-form textarea{width:100%;border:2px solid var(--ink);border-radius:6px;padding:6px 8px;background:#fff}
.card-form textarea{min-height:60px;resize:vertical}
.card-form .row{display:flex;gap:10px}.card-form .row>*{flex:1}
.card-form .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.seg{display:flex;gap:6px;margin-top:4px}
.seg label{flex:1;margin:0;border:2px solid var(--ink);border-radius:6px;padding:6px;text-align:center;color:var(--ink);cursor:pointer;background:#fff;font-family:var(--px)}
.seg input{display:none}
.seg label:has(input:checked){background:var(--accent);color:#fff}
.quote{background:#fff;border:2px solid var(--ink);border-radius:6px;padding:8px 10px;margin-top:8px;font-size:.9rem}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:20;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast div{background:var(--ink);color:#ffad55;border:2px solid #ffad55;border-radius:6px;padding:8px 18px;font-family:var(--px);animation:pop 2.8s forwards}
@keyframes pop{0%{opacity:0;transform:translateY(-8px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){#toast div{animation-duration:.01s;animation-delay:2.5s}}
</style>
</head>
<body>
<header class="hud">
  <div class="title">專案冒險<small>原型</small></div>
  <select id="proj" aria-label="專案"></select>
  <div class="lv">Lv <b id="lv">1</b><div class="bar"><i id="xpbar"></i></div><span id="xptxt"></span></div>
  <div class="stat">命中率<b id="hit">–</b></div>
  <div class="stat">掌握度<b id="cal">–</b></div>
  <div class="stat">待揭曉<b id="pend">0</b></div>
  <div id="store"></div>
</header>
<div class="demo" id="demo" hidden></div>
<div class="wrap">
<nav id="chips" aria-label="路線圖"></nav>
<div class="world">
  <canvas id="cv" aria-label="關卡地圖"></canvas>
  <div class="hint"><span>用滑鼠點：點東西會走到它旁邊並顯示內容，點空地就走過去。　<b>文件</b>：綠勾已確認／橘點進行中／灰色還缺　<b>白板</b>待辦（可打勾）　<b>警告牌</b>事件簿　<b>玻璃門</b>過關目標</span><span><button class="sm" id="goL">◀</button> <button class="sm" id="goR">▶</button></span></div>
</div>
<div class="cols">
  <section class="panel" id="near" aria-live="polite"></section>
  <section class="panel">
    <div class="tabs"><button data-tab="turn">待對答案</button><button data-tab="deck">打法統計</button><button data-tab="stats">戰績</button></div>
    <div id="side"></div>
  </section>
</div>
</div>
<div id="modal" hidden></div>
<div id="toast"></div>

<script>
// 專案冒險（原型）：從側面看的橫向關卡。每個階段是一個房間，背景依階段類型不同；
// 房間裡由左到右是：階段立牌 → 文件（台座上漂浮的紙）→ 任務板 → 事件牌 → 要打交道的人 → 過關目標的門。
// work.json 只讀不寫；這裡自己的資料存在同一個資料夾的 game.json（與瀏覽器 localStorage）。
// 美術：Ninja Adventure Asset Pack（Pixel-Boy & AAA，CC0）；字型：Cubic 11（OFL）。見 assets/CREDITS.md。

const SELFTEST = location.search.includes('selftest');
const LS_KEY = SELFTEST ? 'pm-game-selftest' : 'pm-game-v1';
const ACTIONS = ['寄信說明並給期限', '打電話或當面講', '約一場會議', '副本給對方主管', '往上報給我方主管', '先做，事後補確認', '等待，先不動作'];
const SIDE = { internal: { label: '我方', img: 'team' }, client: { label: '客戶', img: 'client' }, vendor: { label: '供應商', img: 'vendor' } };
const DOC_STATUS = { confirmed: '已確認', review: '送審中', draft: '草稿', todo: '尚未開始', none: '尚未開始', na: '不適用' };
const STAGE_STATUS = { done: '已過關', doing: '進行中', todo: '還沒到' };
const WEEK = '日一二三四五六';

const pad = n => String(n).padStart(2, '0');
const fmt = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => fmt(new Date());
const toDate = s => new Date(s + 'T00:00:00');
const addDays = (s, n) => { const d = toDate(s); d.setDate(d.getDate() + n); return fmt(d); };
const dayDiff = (a, b) => Math.round((toDate(a) - toDate(b)) / 86400000);
const isDate = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
const md = s => s ? s.slice(5).replace('-', '/') : '';
const mdw = s => `${md(s)}（${WEEK[toDate(s).getDay()]}）`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- 示範資料（全部虛構） ----------
const D0 = today(), dd = n => addDays(D0, n);
const DEMO = { projects: [{
  id: 'demo', name: '示範：診所預約系統（虛構）', stageIndex: 2,
  people: [{ id: 'me', name: '我方團隊', side: 'internal' }, { id: 'cl', name: '診所窗口', side: 'client' }, { id: 'vd', name: '開發夥伴', side: 'vendor' }],
  milestones: [{ id: 'm1', name: '合約簽回', date: dd(-31), done: true }, { id: 'm2', name: '功能清單確認', date: dd(-17), done: true }, { id: 'm3', name: '設計定稿', date: dd(6), done: false }, { id: 'm4', name: '正式上線', date: dd(40), done: false }],
  stages: [
    { id: 's1', name: '啟動', status: 'done', enteredOn: dd(-40), doneOn: dd(-31), exit: '合約簽回、Kick off 完成', gate: { docs: true }, docs: [{ id: 'd1', name: '合約', status: 'confirmed', owner: 'me', confirmedOn: dd(-33) }, { id: 'd2', name: 'Kick off 簡報', status: 'confirmed', owner: 'me', confirmedOn: dd(-31) }], checklist: [{ id: 'c1', text: '確認雙方窗口', done: true, due: dd(-36) }] },
    { id: 's2', name: '需求訪談', status: 'done', enteredOn: dd(-30), doneOn: dd(-17), exit: '功能清單雙方確認', gate: { docs: true }, docs: [{ id: 'd3', name: '功能清單', status: 'confirmed', owner: 'me', confirmedOn: dd(-17) }, { id: 'd4', name: '訪談紀錄', status: 'confirmed', owner: 'me', confirmedOn: dd(-22) }], checklist: [{ id: 'c2', text: '三場訪談完成', done: true, due: dd(-21) }] },
    { id: 's3', name: '設計', status: 'doing', enteredOn: dd(-16), exit: '設計稿經客戶書面確認', gate: { docs: true, checklist: true }, docs: [{ id: 'd5', name: 'Wireframe', status: 'confirmed', owner: 'me', confirmedOn: dd(-8), url: 'https://example.com/wireframe' }, { id: 'd6', name: 'UI 精稿', status: 'review', owner: 'me' }, { id: 'd7', name: '設計確認信', status: 'todo', owner: 'cl' }], checklist: [{ id: 'c3', text: '第一輪設計回饋收齊', done: true, due: dd(-5) }, { id: 'c4', text: '第二輪修改完成', done: false, due: dd(2) }] },
    { id: 's4', name: '開發', status: 'todo', exit: '功能完成並通過內部測試', gate: { docs: true }, docs: [{ id: 'd8', name: 'API 文件', status: 'todo', owner: 'vd' }, { id: 'd9', name: '測試案例', status: 'todo', owner: 'me' }], checklist: [{ id: 'c5', text: '測試環境建好', done: false, due: dd(12) }] },
    { id: 's5', name: '驗收上線', status: 'todo', exit: '客戶簽驗收單', gate: { docs: true }, docs: [{ id: 'd10', name: '驗收單', status: 'todo', owner: 'cl' }], checklist: [{ id: 'c6', text: '正式環境部署', done: false, due: dd(38) }] },
  ],
  tasks: [
    { id: 't1', name: '回覆 UI 精稿第二輪意見', assignee: 'cl', stage: 's3', status: 'todo', due: dd(-1), dueNote: '原訂昨天' },
    { id: 't2', name: '提供診所 Logo 向量檔', assignee: 'cl', stage: 's3', status: 'todo', due: dd(3), dueNote: '' },
    { id: 't3', name: '依回饋修改掛號頁', assignee: 'me', stage: 's3', status: 'doing', due: dd(2), dueNote: '等客戶意見' },
    { id: 't4', name: '確認開發人力起始日', assignee: 'vd', stage: 's3', status: 'todo', due: dd(4), dueNote: '' },
    { id: 't5', name: '提供簡訊服務帳號', assignee: 'cl', stage: 's4', status: 'todo', due: '', dueNote: '開發前' },
    { id: 't6', name: '簽回設計確認', assignee: 'cl', stage: 's2', status: 'done', due: dd(-18), dueNote: '' },
    { id: 't7', name: '提供測試機與測試帳號', assignee: 'vd', stage: 's4', status: 'todo', due: dd(14), dueNote: '' },
  ],
}] };

// ---------- 狀態 ----------
let work = window.__WORK || DEMO, isDemo = !window.__WORK, dir = null, workModified = 0;
let game = loadLocal();
let editStage = '';
let pid = null, tab = 'turn', objs = [], spans = [], nearId = null, pin = null, hoverId = null;
const ROOM_W = 1290; let H = 420, GROUND = 324;
const player = { x: 0, tx: null, sp: 560, dir: 3, moving: false };
const keys = {};

function emptyGame() { return { version: 1, xp: 0, cards: [], events: [], logs: [], deck: [], updatedAt: '' }; }
function loadLocal() { try { return Object.assign(emptyGame(), JSON.parse(localStorage.getItem(LS_KEY) || '{}')); } catch (e) { return emptyGame(); } }
let saveTimer = null;
function saveGame() {
  game.updatedAt = new Date().toISOString();
  try { localStorage.setItem(LS_KEY, JSON.stringify(game)); } catch (e) {}
  if (!dir || SELFTEST) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try { const fh = await dir.getFileHandle('game.json', { create: true }); const w = await fh.createWritable(); await w.write(JSON.stringify(game, null, 2)); await w.close(); }
    catch (e) { toast('game.json 寫入失敗：' + e.message); }
  }, 300);
}

const proj = () => work.projects.find(p => p.id === pid) || work.projects[0];
const person = id => proj().people.find(x => x.id === id);
const stageOf = id => proj().stages.find(s => s.id === id);
function tasksIn(stage) {
  const p = proj(), ids = new Set(p.stages.map(s => s.id));
  const main = p.stages[Math.min(p.stageIndex ?? 0, p.stages.length - 1)];
  return p.tasks.filter(t => t.stage === stage.id || (!ids.has(t.stage) && main && main.id === stage.id));
}
const undone = t => t.status !== 'done';
const overdue = t => undone(t) && t.due && t.due <= today();
const sideOf = t => person(t.assignee)?.side || 'internal';
const linkOf = d => /^https?:\/\//i.test(d?.url || '') ? d.url : '';
const myCards = () => game.cards.filter(c => c.pid === pid);
const pending = () => myCards().filter(c => !c.result).sort((a, b) => a.revealOn.localeCompare(b.revealOn));
const outcome = c => ({ hit: 1, half: .5, miss: 0 }[c.result]);
const calib = c => 1 - Math.pow(c.conf / 100 - outcome(c), 2);
function gateInfo(s) {
  const docs = (s.docs || []).filter(d => d.status !== 'na'), cl = s.checklist || [], g = s.gate || {};
  return { docs, cl, needDocs: !!g.docs, needCl: !!g.checklist, dOk: docs.filter(d => d.status === 'confirmed').length, cOk: cl.filter(c => c.done).length };
}
function waitParts(s) {
  const ts = tasksIn(s).filter(undone), g = gateInfo(s), parts = [];
  ['client', 'vendor', 'internal'].forEach(k => { const n = ts.filter(t => sideOf(t) === k).length; if (n) parts.push(`${SIDE[k].label} ${n}`); });
  if (g.docs.length - g.dOk) parts.push(`文件 ${g.docs.length - g.dOk}`);
  return parts;
}

// ---------- 每個階段的起訖日（只用來顯示，不決定位置） ----------
// 有日期就用日期；沒有的話接在前一段後面，至少七天。
function computeSpans(p) {
  const td = today();
  const raw = p.stages.map(s => {
    const ts = tasksIn(s);
    const ks = [s.enteredOn, s.doneOn, ...ts.flatMap(t => [t.dueStart, t.due]), ...(s.checklist || []).map(c => c.due), ...(s.docs || []).map(d => d.confirmedOn), ...(s.sprints || []).flatMap(x => [x.start, x.end])].filter(isDate).sort();
    let a = isDate(s.enteredOn) ? s.enteredOn : '', b = isDate(s.doneOn) ? s.doneOn : '';
    if (s.status === 'done') { if (!a && ks.length) a = ks[0]; if (!b && ks.length) b = ks[ks.length - 1] > td ? td : ks[ks.length - 1]; }
    else if (s.status === 'doing') { if (!a) a = ks[0] && ks[0] < td ? ks[0] : td; if (!b) b = ks.length && ks[ks.length - 1] > addDays(td, 7) ? ks[ks.length - 1] : addDays(td, 7); }
    else { if (!a && ks.length) a = ks[0] > td ? ks[0] : addDays(td, 1); if (!b && ks.length) b = ks[ks.length - 1]; }
    return { s, a, b };
  });
  const first = raw.findIndex(r => r.a);
  const anchor = first < 0 ? addDays(td, -7 * raw.length) : raw[first].a;
  if (first !== 0) { let end = addDays(anchor, -1); for (let i = (first < 0 ? raw.length : first) - 1; i >= 0; i--) { raw[i].b = end; raw[i].a = addDays(end, -6); end = addDays(raw[i].a, -1); } }
  let cursor = anchor;
  raw.forEach((r, i) => {
    if (!r.a) r.a = r.s.status === 'todo' && cursor <= td ? addDays(td, 1) : cursor;
    if (!r.b || r.b < r.a) r.b = addDays(r.a, 13);
    if (dayDiff(r.b, r.a) < 6) r.b = addDays(r.a, 6);
    if (r.b >= cursor) cursor = addDays(r.b, 1);
    r.i = i;
  });
  return raw;
}

    <input type="text" name="custom" placeholder="自訂的打法" hidden style="margin-top:6px">
    <label>我猜會發生什麼（寫得出對錯的句子）</label><textarea name="predict" required placeholder="例：週四前會回，但只回一半的項目"></textarea>
    <div class="row"><div><label>幾成把握：<b id="confv">70</b>%</label><input type="range" name="conf" min="50" max="95" step="5" value="70" style="width:100%"></div>
    <div><label>哪一天對答案</label><input type="date" name="revealOn" value="${addDays(today(), 3)}" required></div></div>
    <input type="hidden" name="stageId" value="${esc(stageId)}"><input type="hidden" name="taskId" value="${esc(taskId || '')}"><input type="hidden" name="personId" value="${esc(pp?.id || '')}"><input type="hidden" name="target" value="${esc(target)}">
    <div class="acts"><button type="button" data-close>取消</button><button class="hi">打出去</button></div></form>`;
  $('modal').hidden = false; $('modal').querySelector('textarea').focus();
}
function playCard(f) {
  const action = f.action === '__custom' ? (f.custom || '').trim() : f.action;
  if (!action || !f.predict.trim() || !isDate(f.revealOn)) return false;
  if (f.action === '__custom' && !ACTIONS.includes(action) && !game.deck.includes(action)) game.deck.push(action);
  game.cards.push({ id: uid(), pid, stageId: f.stageId, taskId: f.taskId || '', personId: f.personId || '', target: f.target, action, predict: f.predict.trim(), conf: +f.conf, playedOn: today(), revealOn: f.revealOn, result: '', actual: '', lesson: '' });
  gainXp(5, '牌打出去了'); saveGame(); return true;
}
function openResolve(id) {
  const c = game.cards.find(x => x.id === id); if (!c) return;
  $('modal').innerHTML = `<form class="card-form" data-form="resolve">
    <h2>對答案</h2><div class="muted">${md(c.playedOn)} 出牌 · ${md(c.revealOn)} 揭曉</div>
    <div class="quote"><b>${esc(c.action)}</b> → ${esc(c.target)}<br>我猜：${esc(c.predict)}（${c.conf}% 把握）</div>
    <label>結果</label><div class="seg">
      <label><input type="radio" name="result" value="hit" required><span>🎯 猜中</span></label>
      <label><input type="radio" name="result" value="half"><span>◐ 中一半</span></label>
      <label><input type="radio" name="result" value="miss"><span>✗ 沒中</span></label></div>
    <label>實際發生了什麼</label><textarea name="actual" placeholder="例：週五下午才回，全部項目都回了"></textarea>
    <label>學到什麼（下次會怎麼打）</label><textarea name="lesson" placeholder="例：副本給主管對這位窗口有效，但他習慣壓線才回"></textarea>
    <input type="hidden" name="id" value="${c.id}">
    <div class="acts"><button type="button" data-close>取消</button><button class="hi">揭曉</button></div></form>`;
  $('modal').hidden = false;
}
function resolveCard(f) {
  const c = game.cards.find(x => x.id === f.id); if (!c || !f.result) return false;
  Object.assign(c, { result: f.result, actual: (f.actual || '').trim(), lesson: (f.lesson || '').trim(), resolvedOn: today() });
  gainXp(10 + Math.round(20 * calib(c)) + (c.lesson ? 5 : 0), { hit: '🎯 猜中', half: '◐ 中一半', miss: '✗ 沒中，但你知道為什麼了' }[c.result]); saveGame(); return true;
}
// 記進度：誰在哪一天做了什麼。只存在遊戲這邊（game.json），不會寫到工作台或 Notion。
function openLog(taskId) {
  const tk = proj().tasks.find(x => x.id === taskId); if (!tk) return;
  $('modal').innerHTML = `<form class="card-form" data-form="log"><h2>記一筆進度</h2><div class="muted">${esc(person(tk.assignee)?.name || '')}：${esc(tk.name)}</div>
    <label>哪一天</label><input type="date" name="date" value="${today()}" required>
    <label>發生了什麼（對方做了什麼、回了什麼）</label><textarea name="text" required placeholder="例：回覆了三項意見，Logo 還沒給"></textarea>
    <div class="muted" style="margin-top:6px">這筆只存在遊戲這邊，不會寫進工作台，也不會同步到 Notion。</div>
    <input type="hidden" name="taskId" value="${esc(taskId)}"><div class="acts"><button type="button" data-close>取消</button><button class="hi">記下來</button></div></form>`;
  $('modal').hidden = false; $('modal').querySelector('textarea').focus();
}
// 改期：會改工作台這件事的期限與「期限說明」。
function openMove(taskId) {
  const tk = proj().tasks.find(x => x.id === taskId); if (!tk) return; const s = proj().stages.find(x => tasksIn(x).includes(tk));
  $('modal').innerHTML = `<form class="card-form" data-form="move"><h2>改期</h2><div class="muted">${esc(person(tk.assignee)?.name || '')}：${esc(tk.name)}　原本的期限：${tk.due ? md(tk.due) : '沒有'}</div>
    <label>新的期限</label><input type="date" name="due" value="${tk.due && tk.due > today() ? tk.due : addDays(today(), 7)}" required>
    <label>期限說明（會寫進工作台；這一欄會同步到 Notion 待交付表，請寫對外說得出口的版本）</label><input type="text" name="note" value="${esc(tk.due ? '原 ' + md(tk.due) + '，' : '')}" required placeholder="例：原 11/13，等客戶補資料後順延">
    <label><input type="checkbox" name="ev" checked style="width:auto"> 同時記到這一關的事件簿</label>
    <label>對後面的影響（只記在事件簿，不會寫到工作台）</label><input type="text" name="impact" placeholder="例：設計定稿跟著晚一週">
    <input type="hidden" name="taskId" value="${esc(taskId)}"><input type="hidden" name="stageId" value="${esc(s?.id || '')}"><div class="acts"><button type="button" data-close>取消</button><button class="hi">改期</button></div></form>`;
  $('modal').hidden = false;
}
async function moveTask(f) {
  if (!isDate(f.due) || !f.note.trim()) return false; let name = '', old = '';
  const ok = await writeBack(d => { const tk = d.projects.find(x => x.id === pid)?.tasks.find(x => x.id === f.taskId); if (!tk) return false; name = tk.name; old = tk.due || ''; tk.due = f.due; if (tk.dueStart && tk.dueStart > f.due) tk.dueStart = ''; tk.dueNote = f.note.trim(); return true; });
  if (ok && f.ev) game.events.push({ id: uid(), pid, stageId: f.stageId, text: `「${name}」改期：${old ? md(old) : '沒有期限'} → ${md(f.due)}`, date: today(), impact: (f.impact || '').trim(), addedOn: today() });
  if (ok) { saveGame(); toast(`已改到 ${md(f.due)}`); }
  return ok;
}
const formData = form => Object.fromEntries(new FormData(form).entries());

// ---------- 打勾：寫回工作台 ----------
// 只改一筆。每次先讀工作台最新的檔案、改那一筆、留一份備份（work.backup.json）再寫回，不會蓋掉工作台那邊剛改的其他東西。
// 示範資料沒有檔案，只改記憶體裡的。
async function writeBack(change) {
  if (!dir) { const ok = change(work); refresh(); return ok; }
  try {
    const read = async () => (await (await dir.getFileHandle('work.json')).getFile());
    const before = await (await read()).text(), data = JSON.parse(before);
    if (!change(data)) { toast('工作台裡找不到這一筆，可能剛被改過'); await pullIfChanged(); return false; }
    const pr = data.projects.find(x => x.id === pid); if (pr) pr.updatedAt = new Date().toISOString();
    const put = async (name, text) => { const h = await dir.getFileHandle(name, { create: true }), w = await h.createWritable(); await w.write(text); await w.close(); };
    await put('work.backup.json', before); await put('work.json', JSON.stringify(data, null, 2));
    work = data; workModified = (await read()).lastModified; refresh(); return true;
  } catch (e) { toast('寫回工作台失敗：' + e.message); renderNear(); return false; }
}
async function saveStage(stageId, f) {
  if (!f.name.trim()) return; if (isDate(f.enteredOn) && isDate(f.doneOn) && f.doneOn < f.enteredOn) return toast('完成日不能早於開始日');
  const ok = await writeBack(d => { const s = d.projects.find(x => x.id === pid)?.stages.find(x => x.id === stageId); if (!s) return false; s.name = f.name.trim(); s.enteredOn = isDate(f.enteredOn) ? f.enteredOn : ''; s.doneOn = isDate(f.doneOn) ? f.doneOn : ''; s.exit = (f.exit || '').trim(); return true; });
  if (ok) { editStage = ''; toast('已存到工作台'); renderAll(); }
}
async function toggleTask(id) {
  let done = false;
  const ok = await writeBack(d => { const tk = d.projects.find(x => x.id === pid)?.tasks.find(x => x.id === id); if (!tk) return false; tk.status = tk.status === 'done' ? 'todo' : 'done'; done = tk.status === 'done'; return true; });
  if (ok && done) { gainXp(3, '完成一件事'); saveGame(); renderHud(); }
}
async function toggleCheck(stageId, checkId) {
  let done = false;
  const ok = await writeBack(d => { const c = d.projects.find(x => x.id === pid)?.stages.find(x => x.id === stageId)?.checklist?.find(x => x.id === checkId); if (!c) return false; c.done = !c.done; done = c.done; return true; });
  if (ok && done) { gainXp(3, '完成一件事'); saveGame(); renderHud(); }
}

// ---------- 事件 ----------
document.addEventListener('submit', e => {
  e.preventDefault(); const kind = e.target.dataset.form, f = formData(e.target);
  if (kind === 'card' && playCard(f)) { $('modal').hidden = true; tab = 'turn'; refresh(); }
  if (kind === 'resolve' && resolveCard(f)) { $('modal').hidden = true; tab = 'stats'; refresh(); }
  if (kind === 'log' && f.text.trim() && isDate(f.date)) { (game.logs = game.logs || []).push({ id: uid(), pid, taskId: f.taskId, date: f.date, text: f.text.trim() }); gainXp(2, '記下一筆進度'); saveGame(); $('modal').hidden = true; renderAll(); }
  if (kind === 'stage') saveStage(e.target.dataset.stage, f);
  if (kind === 'move') moveTask(f).then(ok => { if (ok) { $('modal').hidden = true; renderAll(); } });
  if (kind === 'event' && f.text.trim()) { game.events.push({ id: uid(), pid, stageId: e.target.dataset.stage, text: f.text.trim(), date: isDate(f.date) ? f.date : today(), impact: (f.impact || '').trim(), addedOn: today() }); gainXp(5, '記下一件事'); saveGame(); renderAll(); }
});
document.addEventListener('click', e => {
  const ed = e.target.closest('[data-edit-stage]'); if (ed) { editStage = ed.dataset.editStage; renderNear(); return; }
  const b = e.target.closest('button'); if (!b) { if (e.target.id === 'modal') $('modal').hidden = true; return; }
  const d = b.dataset;
  if ('close' in d) $('modal').hidden = true;
  else if ('play' in d) openCard({ stageId: d.stage, taskId: d.play, personId: d.person });
  else if (d.resolve) openResolve(d.resolve);
  else if (d.log) openLog(d.log);
  else if (d.move) openMove(d.move);
  else if (d.evdel) { game.events = game.events.filter(x => x.id !== d.evdel); saveGame(); renderAll(); }
  else if (d.tab) { tab = d.tab; renderSide(); }
  else if ('now' in d) { pin = null; walkTo(nowX()); }
  else if (d.room) { pin = null; walkTo(+d.room * ROOM_W + 150); }
  else if (d.goto) { const tk = proj().tasks.find(x => x.id === d.goto), o = objs.find(q => q.type === 'npc' && q.ref.id === tk.assignee && tasksIn(q.stage).includes(tk)) || objs.find(q => q.type === 'board' && tasksIn(q.stage).includes(tk)); if (o) { pin = o.id; standAt(o); } }
  else if (d.store === 'connect') connect();
});
document.addEventListener('change', e => {
  if (e.target.name === 'action') e.target.form.custom.hidden = e.target.value !== '__custom';
  if (e.target.id === 'proj') { pid = e.target.value; enterProject(); }
  if (e.target.dataset.done) toggleTask(e.target.dataset.done);
  if (e.target.dataset.check) toggleCheck(...e.target.dataset.check.split('|'));
});
document.addEventListener('input', e => { if (e.target.name === 'conf') $('confv').textContent = e.target.value; });
addEventListener('keydown', e => { if (e.key === 'Escape') $('modal').hidden = true; });
addEventListener('blur', () => { Object.keys(keys).forEach(k => keys[k] = false); });
const worldX = e => e.clientX - cv.getBoundingClientRect().left + cam();
const objAt = wx => { let best = null, bd = 34; objs.forEach(o => { const d = Math.abs(o.x - wx); if (d < bd) { bd = d; best = o; } }); return best; };
cv.addEventListener('click', e => { const wx = worldX(e), o = objAt(wx); if (o) { pin = o.id; standAt(o); } else { pin = null; walkTo(wx); } });
cv.addEventListener('mousemove', e => { const o = objAt(worldX(e)); hoverId = o ? o.id : null; });
cv.addEventListener('mouseleave', () => { hoverId = null; });
const hold = (el, k) => { el.addEventListener('pointerdown', () => keys[k] = true); ['pointerup', 'pointerleave', 'pointercancel'].forEach(n => el.addEventListener(n, () => keys[k] = false)); };
hold($('goL'), 'left'); hold($('goR'), 'right');
addEventListener('resize', resize);

// ---------- 讀工作台資料（沿用工作台記住的資料夾授權） ----------
const idb = () => new Promise((res, rej) => { const r = indexedDB.open('workbench-vault', 1); r.onupgradeneeded = () => r.result.createObjectStore('handles'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const getHandle = async () => { const db = await idb(); return new Promise((res, rej) => { const q = db.transaction('handles', 'readonly').objectStore('handles').get('dir'); q.onsuccess = () => res(q.result || null); q.onerror = () => rej(q.error); }); };
const setHandle = async h => { const db = await idb(); return new Promise((res, rej) => { const q = db.transaction('handles', 'readwrite').objectStore('handles').put(h, 'dir'); q.onsuccess = () => res(); q.onerror = () => rej(q.error); }); };
async function readJson(h, name) { try { const f = await (await h.getFileHandle(name)).getFile(); const t = await f.text(); return { data: t.trim() ? JSON.parse(t) : null, modified: f.lastModified }; } catch (e) { if (e.name === 'NotFoundError') return { data: null, modified: 0 }; throw e; } }
async function useDir(h) {
  const w = await readJson(h, 'work.json');
  if (!w.data?.projects?.length) return false;
  dir = h; work = w.data; workModified = w.modified; isDemo = false;
  const g = await readJson(h, 'game.json');
  if (g.data && (g.data.updatedAt || '') >= (game.updatedAt || '')) { game = Object.assign(emptyGame(), g.data); try { localStorage.setItem(LS_KEY, JSON.stringify(game)); } catch (e) {} }
  else if (game.cards.length || game.events.length) saveGame();
  pid = null; enterProject(); return true;
}
// 記住的資料夾讀不到 work.json（例如資料夾搬過家）就請使用者重新選一次
async function connect() {
  if (!('showDirectoryPicker' in window)) return toast('請用 Chrome 開啟才能連結資料夾');
  try {
    let h = await getHandle(), ok = false;
    if (h) { try { ok = (await h.requestPermission({ mode: 'readwrite' })) === 'granted' && await useDir(h); } catch (e) { ok = false; } }
    if (!ok) { h = await showDirectoryPicker({ id: 'workbench-data', mode: 'readwrite' }); if (await useDir(h)) await setHandle(h); else toast('這個資料夾裡沒有 work.json，請選「專案工作區／data」'); }
  } catch (e) { if (e.name !== 'AbortError') toast('連結失敗：' + e.message); }
}
async function boot() { try { const h = await getHandle(); if (h && (await h.queryPermission({ mode: 'readwrite' })) === 'granted') await useDir(h); } catch (e) {} }
async function pullIfChanged() { if (!dir) return; try { const w = await readJson(dir, 'work.json'); if (w.data && w.modified > workModified) { work = w.data; workModified = w.modified; const x = player.x; enterProject(true); player.x = x; } } catch (e) {} }
addEventListener('focus', pullIfChanged);

const nowX = () => Math.max(0, spans.findIndex(r => r.s.status === 'doing')) * ROOM_W + 150;
function enterProject(keepPos) {
  if (!work.projects.some(p => p.id === pid)) pid = work.projects[0].id;
  $('proj').innerHTML = work.projects.map(p => `<option value="${esc(p.id)}" ${p.id === pid ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
  $('demo').hidden = !isDemo;
  $('demo').innerHTML = '現在看到的是示範資料（虛構）。<button class="sm hi" data-store="connect">連結專案工作台的資料</button>　請選「專案工作區／data」資料夾；之後每次開啟按一下這顆即可。';
  $('store').textContent = isDemo ? '' : '● 已連結工作台資料。打勾會寫回工作台；牌與事件存在 game.json';
  buildWorld(); if (!keepPos) { player.x = nowX(); player.tx = null; }
  pin = null; nearId = null; renderAll();
}

// ---------- 啟動 ----------
resize(); enterProject(); requestAnimationFrame(loop);
loadImages().then(() => document.fonts && document.fonts.load('11px "Cubic 11"')).catch(() => {}).then(() => { if (SELFTEST) selftest(); else boot(); });

function selftest() {
  const out = {};
  try {
    game = emptyGame(); refresh();
    out.rooms = spans.length; out.themes = spans.map(r => themeOf(r.s)).join(',');
    out.types = objs.reduce((a, o) => (a[o.type] = (a[o.type] || 0) + 1, a), {}); out.img = Object.values(IMG).every(i => (i.width || 0) > 0); out.art = ART;
    const npc = objs.find(o => o.type === 'npc' && o.stage.status === 'doing' && o.ref.side !== 'internal'), tk = tasksIn(npc.stage).find(x => undone(x) && x.assignee === npc.ref.id);
    playCard({ action: ACTIONS[0], predict: '測試預測', conf: '90', revealOn: today(), stageId: npc.stage.id, taskId: tk.id, personId: tk.assignee, target: 'x' });
    playCard({ action: '__custom', custom: '自訂牌', predict: '第二張', conf: '60', revealOn: addDays(today(), 2), stageId: npc.stage.id, taskId: '', personId: tk.assignee, target: 'y' });
    refresh(); out.pending = pending().length;
    ['sign', 'doc', 'board', 'event', 'npc', 'gate'].forEach(k => { const o = objs.find(q => q.type === k && q.stage.id === npc.stage.id); nearId = o.id; renderNear(); out['p_' + k] = $('near').innerHTML.length; });
    resolveCard({ id: game.cards[0].id, result: 'hit', actual: 'a', lesson: 'l' }); resolveCard({ id: game.cards[1].id, result: 'miss', actual: '', lesson: '' }); refresh();
    const st = stats(game.cards); out.xp = game.xp; out.hit = st.hit; out.cal = +st.cal.toFixed(3);
    ['turn', 'deck', 'stats'].forEach(k => { tab = k; renderSide(); out['tab_' + k] = $('side').innerHTML.length; });
    out.evform = $('near').innerHTML.includes('evform') || (nearId = objs.find(q => q.type === 'event' && q.stage.id === npc.stage.id).id, renderNear(), $('near').innerHTML.includes('evform'));
    tab = 'turn'; pin = npc.id; nearId = npc.id; player.x = npc.x - 150; renderAll(); draw(1000); out.ok = true;
  } catch (e) { out.error = e.message + ' @ ' + (e.stack || '').split('\n')[1]; }
  try { localStorage.removeItem(LS_KEY); } catch (e) {}
  document.title = 'SELFTEST ' + JSON.stringify(out);
}
</script>
</body>
</html>
